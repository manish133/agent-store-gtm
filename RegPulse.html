<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RegPulse Agent Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0C1220; --bg2:#0F1728; --surf:#141D31; --surf2:#1A2540; --line:#26324C; --line2:#33415F;
  --text:#E7ECF6; --muted:#8C99B5; --faint:#5E6B88;
  --accent:#4DA3FF; --accent-ink:#06121F;
  --genai:#A98BFF; --agent:#F2994A; --ml:#34C3B0; --rules:#98A6C2; --human:#7FD68A; --locked:#CFE3FF;
  --low:#5C7FA3; --watch:#E6C84F; --high:#F0616D;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{text-wrap:balance}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:30px;height:30px;border-radius:8px;background:conic-gradient(from 200deg,var(--genai),var(--ml),var(--agent),var(--genai));display:grid;place-items:center;flex:none}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--bg2)}
.brand b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{color:var(--muted);font-size:11.5px}
.nav{display:grid;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;white-space:nowrap;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13.5px;text-align:left;width:100%}
.nv svg{width:16px;height:16px;flex:none}
.nv:hover{background:var(--surf);color:var(--text)}
.nv[aria-current="page"]{background:var(--surf2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nv .bd{margin-left:auto;white-space:nowrap;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;background:var(--surf2);color:var(--muted);font-variant-numeric:tabular-nums}
.nv .bd.hot{background:color-mix(in srgb,var(--agent) 22%,transparent);color:var(--agent)}
.nv .bd.flag{background:color-mix(in srgb,var(--high) 22%,transparent);color:var(--high)}
.nv .bd.new{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.sidefoot{margin-top:auto;display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted)}
.sidefoot .li{display:flex;align-items:center;gap:7px}
.sidefoot .li i{width:9px;height:9px;border-radius:3px;background:var(--tc)}
.sidefoot .li.t-locked i{background:transparent;border:1.5px dashed var(--locked)}
.sidefoot b{color:var(--text)}

.main{min-width:0;padding-inline:24px;padding-block:0 60px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.topbar h1{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.cur{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
.cur i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.cur.run i{background:var(--high);animation:blink .6s infinite alternate}
.cur.done i{background:var(--ml)}
.cur b{color:var(--text);font-weight:600}
.lookup{margin-left:auto;display:flex;gap:6px;align-items:center}
.lookup input{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:190px;font-family:var(--mono);font-size:13px}
.screen{padding-top:20px}
.screen>.intro{color:var(--muted);margin:0 0 16px;font-size:14px;max-width:70ch}

.btn{border:1px solid var(--line2);background:var(--surf2);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px}

/* ---------- feed screen ---------- */
.fstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.circlist{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 120px 150px;gap:14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.crow.na{opacity:.6}
.crow .src{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.crow .src small{display:block;font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint);font-size:11px;margin-top:2px}
.crow .tt{font-weight:700}
.crow .sh{color:var(--muted);font-size:12.5px}
.crow .pr{font-size:12.5px;color:var(--muted)}
.crow .il{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:0 6px;margin-left:6px;vertical-align:1px}
.stat{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;border:1px solid var(--line2);color:var(--muted);width:max-content}
.stat.new{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.stat.rev{color:var(--agent);border-color:color-mix(in srgb,var(--agent) 50%,transparent)}
.stat.ok{color:var(--human);border-color:color-mix(in srgb,var(--human) 50%,transparent)}

/* ---------- floor screen ---------- */
.intake{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch;margin-bottom:14px}
.circs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.circ{text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:grid;gap:3px;position:relative}
.circ:hover{border-color:var(--line2)}
.circ[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,rgba(77,163,255,.10),transparent 70%),var(--surf)}
.circ .tag{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.circ .tt{font-weight:700;font-size:15px}
.circ .sh{color:var(--muted);font-size:12.5px}
.circ .il{position:absolute;top:9px;right:11px;font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:20px;padding:0 6px}
.controls{display:flex;flex-direction:column;gap:8px;min-width:220px;justify-content:center}
.run{font-size:16px;padding:13px 18px;border-radius:10px;justify-content:center}
.run svg{width:16px;height:16px}
.speed{display:flex;gap:6px;align-items:center;justify-content:space-between}
.seg{display:flex;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surf2);color:var(--text)}

.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.stg{position:relative;padding:8px 10px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;color:var(--faint);font-weight:600;display:flex;gap:8px;align-items:center}
.stg em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint)}
.stg::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);border-radius:0 0 8px 8px;transition:width .5s}
.stg.on{color:var(--text);border-color:var(--line2)}
.stg.on::after{width:60%;animation:pulse 1.2s infinite alternate}
.stg.done{color:var(--muted)}
.stg.done::after{width:100%;background:var(--ml);animation:none}
@keyframes pulse{from{opacity:.5}to{opacity:1}}

.brief{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px;animation:rise .5s ease}
.brief .ref{display:flex;flex-direction:column;justify-content:center;padding:8px 12px;border-radius:8px;border:1px dashed var(--line2);min-width:180px}
.brief .ref b{font-size:13.5px}
.brief .ref span{font-size:11.5px;color:var(--muted)}
.diff{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;gap:2px}
.diff .k{font-size:11.5px;color:var(--muted)}
.diff .v{font-size:13.5px;display:flex;gap:8px;align-items:center}
.diff .o{color:var(--faint);text-decoration:line-through}
.diff .n{color:var(--text);font-weight:700}
.byline{font-size:11px;color:var(--genai);display:flex;align-items:center;gap:6px;align-self:center;margin-left:auto}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.donebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--ml) 45%,transparent);background:linear-gradient(90deg,rgba(52,195,176,.10),transparent 60%),var(--surf);border-radius:12px;padding:12px 14px;margin-bottom:12px;animation:rise .4s ease}
.donebar b{font-size:14.5px}
.donebar span{color:var(--muted);font-size:13px}
.donebar .go{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

.floorrow{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.floorbox{background:radial-gradient(ellipse at 50% 0%,rgba(77,163,255,.06),transparent 60%),var(--bg2);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.floor{position:relative;min-width:940px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:auto 1fr;column-gap:22px;row-gap:10px;padding:14px 18px 20px}
.floor svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.edges path{fill:none;stroke:var(--line2);stroke-width:1.4;transition:stroke .4s,opacity .4s;opacity:.7}
.edges path.lit{opacity:1;stroke-width:1.8}
.edges path.guard{stroke-dasharray:4 4}
.colhead{grid-row:1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;display:flex;gap:6px;align-items:center}
.colhead i{font-style:normal;font-family:var(--mono);color:var(--line2)}
.col{grid-row:2;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;z-index:1}
.agent{--tc:var(--rules);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 10px 8px;display:grid;gap:5px;position:relative;transition:border-color .3s,box-shadow .3s,transform .3s}
.agent .hd{display:flex;gap:7px;align-items:flex-start}
.agent .gl{width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.agent .gl svg{width:13px;height:13px}
.agent .nm{font-weight:700;font-size:12.5px;line-height:1.2;flex:1}
.agent .st{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);border-radius:20px;padding:1px 7px;width:max-content;max-width:100%;white-space:nowrap}
.chip small{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.agent .say{font-family:var(--mono);font-size:11px;color:var(--faint);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.agent .bar i{display:block;height:100%;width:0;background:var(--tc);transition:width .3s}
.agent.work{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 18%,transparent),0 8px 30px -10px color-mix(in srgb,var(--tc) 60%,transparent);transform:translateY(-1px)}
.agent.work .st{background:var(--tc);animation:blink .7s infinite alternate}
.agent.work .say{color:var(--text)}
.agent.done .st{background:var(--ml)}
.agent.done .say{color:var(--muted)}
.agent.wait{border-color:color-mix(in srgb,var(--tc) 60%,transparent)}
.agent.wait .st{background:var(--watch)}
.agent.wait .say{color:var(--watch)}
@keyframes blink{from{opacity:.35}to{opacity:1}}
.t-genai{--tc:var(--genai)} .t-agent{--tc:var(--agent)} .t-ml{--tc:var(--ml)} .t-rules{--tc:var(--rules)} .t-human{--tc:var(--human)} .t-locked{--tc:var(--locked)}
.agent.t-locked{border:1.5px dashed color-mix(in srgb,var(--locked) 55%,transparent);background:repeating-linear-gradient(135deg,rgba(207,227,255,.035) 0 6px,transparent 6px 12px),var(--surf)}
.agent.t-locked .ctr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.agent.t-locked .ctr b{color:var(--text);font-weight:500}
.agent.t-locked .ctr .w b{color:var(--human)}
.guardtag{position:absolute;right:-6px;top:-9px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--bg2);color:var(--locked);border:1px solid color-mix(in srgb,var(--locked) 45%,transparent);border-radius:20px;padding:1px 7px}

.feed{background:var(--bg2);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;max-height:540px}
.feed header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.feed header .live{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.feed header .live i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.feed.on header .live i{background:var(--high);animation:blink .6s infinite alternate}
.feed ol{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
.feed li{display:grid;grid-template-columns:40px 1fr;gap:6px;padding:5px 14px;font-size:12.5px;animation:rise .3s ease}
.feed li time{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:1px}
.feed li b{color:var(--tc);font-weight:600}
.feed .empty{color:var(--faint);font-size:12.5px;padding:14px;display:block}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 4px 0}
.legend .li{display:flex;gap:7px;align-items:center;font-size:12.5px}
.legend .li i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.legend .li span{color:var(--muted)}
.legend .li.t-locked i{background:transparent;border:1.5px dashed var(--locked)}
.legend .mix{margin-left:auto;font-size:12.5px;color:var(--muted)}
.legend .mix b{color:var(--text)}

/* ---------- book / bands ---------- */
.book{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h2,.sechd h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
.bookhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bookhd span{color:var(--muted);font-size:12.5px}
canvas.bookCanvas{width:100%;display:block;cursor:pointer}
.bands{display:grid;gap:12px;align-content:start}
.bandrow{display:grid;gap:5px}
.bandrow .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%;transition:width .6s}
.key{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.key span{display:flex;align-items:center;gap:5px}
.key i{width:9px;height:9px;border-radius:2px;display:inline-block}
.moved{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.moved small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}

/* ---------- common ---------- */
.sechd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechd p{margin:0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.alert b{color:var(--high)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.abars{display:grid;gap:7px}
.abar{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;font-size:13px;background:none;border:0;padding:3px 4px;border-radius:6px;text-align:left}
button.abar:hover{background:var(--surf)}
.abar .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.abar .tr i{display:block;height:100%;background:var(--tc,var(--agent));border-radius:4px}
.abar .c{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--human);border-color:color-mix(in srgb,var(--human) 50%,transparent)}
.pill.back{color:var(--watch);border-color:color-mix(in srgb,var(--watch) 50%,transparent)}
.pill.flag{color:var(--high);border-color:color-mix(in srgb,var(--high) 50%,transparent)}
.rulenote{font-size:11.5px;color:var(--faint)}
.empty-state{border:1px dashed var(--line2);border-radius:14px;padding:40px 24px;display:grid;gap:12px;justify-items:center;text-align:center}
.empty-state h2{font-family:var(--display);font-size:20px;margin:0}
.empty-state p{margin:0;color:var(--muted);max-width:50ch}
.empty-state .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* borrowers */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchip{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.fchip[aria-pressed="true"]{border-color:var(--accent);color:var(--text)}
.fchip span{color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}
.fchip.prop{border-color:var(--agent);color:var(--text)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg2)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surf)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.band{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.band i{width:8px;height:8px;border-radius:50%}
.arrow{color:var(--faint);margin:0 3px}
.sig{color:var(--high);font-size:12px}
.more{margin-top:10px}

/* policy */
.pol{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:grid;gap:8px}
.pcard{text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.pcard[aria-pressed="true"]{border-color:var(--agent);background:linear-gradient(180deg,rgba(242,153,74,.09),transparent 70%),var(--surf)}
.pcard .pt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard b{font-size:13.5px}
.pcard .sec{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pcard .ch{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcard .ch s{color:var(--faint)}
.pcard .ch strong{color:var(--agent)}
.pdetail{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px}
.pdetail .dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pdetail h2{font-family:var(--display);font-size:22px;margin:4px 0 0}
.docref{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.docref .docico{width:30px;height:36px;border-radius:4px;border:1px solid var(--line2);background:var(--surf);display:grid;place-items:center;color:var(--muted)}
.docref b{color:var(--text)}
.redline{background:#F4F1E8;color:#1C2230;border-radius:10px;padding:18px 20px;font-family:Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.65;max-width:72ch}
.redline .clause{font-family:var(--mono);font-size:11px;color:#6B6F7A;display:block;margin-bottom:6px;letter-spacing:.04em}
.redline del{color:#B3261E;background:rgba(179,38,30,.10);text-decoration-thickness:1.5px}
.redline del+ins{margin-left:4px}
.redline ins{color:#1B6B3A;background:rgba(27,107,58,.12);text-decoration:none;border-bottom:1.5px solid #1B6B3A}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.box h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.evi{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;align-items:baseline}
.evi b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.evi span{color:var(--muted)}
.audit{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.audit li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;font-size:13px}
.audit li i{width:10px;height:10px;border-radius:50%;background:var(--tc);margin-top:4px}
.audit li time{font-family:var(--mono);font-size:11px;color:var(--faint)}
.audit li span{color:var(--muted)}
.pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* notices */
.notice{display:grid;grid-template-columns:280px 1fr;gap:14px}
.phone{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start}
.bubble{background:var(--surf2);border-radius:12px 12px 12px 3px;padding:12px 14px;font-size:14.5px;line-height:1.6;max-width:60ch}
.draftflag{font-size:12px;color:var(--watch);display:flex;gap:6px;align-items:center}
.draftflag.ok{color:var(--human)}
.meta{display:grid;gap:8px;font-size:13px;align-content:start}
.meta div.r{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.meta span{color:var(--muted)}

/* tasks */
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:22px 1fr 150px 90px 70px;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.task input{width:16px;height:16px;accent-color:var(--human)}
.task .ow{color:var(--muted);font-size:12.5px}
.task .du{font-family:var(--mono);font-size:12px;color:var(--muted)}
.task.done .tn{text-decoration:line-through;color:var(--muted)}
.task .src{display:block;font-size:11.5px;color:var(--faint)}

/* model governance */
.gov{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.mcard{border:1.5px dashed color-mix(in srgb,var(--locked) 50%,transparent);background:repeating-linear-gradient(135deg,rgba(207,227,255,.03) 0 6px,transparent 6px 12px),var(--bg2);border-radius:14px;padding:18px;display:grid;gap:14px}
.mcard .lk{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--locked) 14%,transparent);color:var(--locked)}
.mcard .lk svg{width:22px;height:22px}
.mcard h2{font-family:var(--display);font-size:22px;margin:0}
.mcard .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.mcard .kv span{color:var(--muted)}
.mcard .kv b{text-align:right}
.bigz{display:flex;gap:10px}
.bigz div{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bigz b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.bigz .w b{color:var(--human)}
.bigz span{font-size:12px;color:var(--muted)}
.access td:nth-child(n+2){text-align:center}
.yes{color:var(--human);font-weight:700}
.no{color:var(--high);font-weight:700}
.guards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.guards div{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.guards svg{width:14px;height:14px;color:var(--human);flex:none}
.flagbox{border:1px solid color-mix(in srgb,var(--high) 45%,transparent);background:linear-gradient(180deg,rgba(240,97,109,.08),transparent),var(--surf);border-radius:12px;padding:14px;display:grid;gap:8px}
.flagbox b{font-size:15px}

/* ask */
.ask{display:grid;gap:12px;max-width:860px}
.qs{display:flex;gap:8px;flex-wrap:wrap}
.q{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px}
.q:hover,.q[aria-pressed="true"]{border-color:var(--genai)}
.ans{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;animation:rise .35s ease}
.ans .who{display:flex;gap:6px;flex-wrap:wrap}
.ans p{margin:0;font-size:14.5px}
.ans .big{font-family:var(--display);font-size:24px;font-weight:700}

/* what-if */
.whatif{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:14px}
.slider{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.slider label{font-size:13px;color:var(--muted)}
.slider .val{font-family:var(--display);font-size:32px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
.wkpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,8,16,.6);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg2);border-left:1px solid var(--line2);z-index:41;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;animation:slide .28s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dhd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhd h3{font-family:var(--display);font-size:22px;margin:2px 0 4px}
.dhd .sub{color:var(--muted);font-size:13px}
.x{background:var(--surf);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.cmp{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 10px;font-size:13.5px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;align-items:center}
.cmp .h{font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.cmp span{color:var(--muted)}
.cmp .n{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.cmp .o{text-align:right;color:var(--faint);font-variant-numeric:tabular-nums}
.trail{list-style:none;margin:0;padding:0;display:grid;position:relative}
.trail li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:12px;position:relative;opacity:0;animation:rise .3s ease forwards}
.trail li::before{content:"";position:absolute;left:8px;top:14px;bottom:-2px;width:1px;background:var(--line2)}
.trail li:last-child::before{display:none}
.trail .dot{width:12px;height:12px;border-radius:50%;background:var(--tc);margin:3px 3px 0;box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 20%,transparent)}
.trail .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.trail .txt{font-size:13.5px;color:var(--muted)}
.trail .txt b{color:var(--text);font-weight:600}
.reco{border:1px solid color-mix(in srgb,var(--agent) 50%,transparent);background:linear-gradient(180deg,rgba(242,153,74,.08),transparent),var(--surf);border-radius:12px;padding:14px;display:grid;gap:8px}
.reco .a{font-family:var(--display);font-size:20px;font-weight:700}
.reco .why{font-size:13px;color:var(--muted)}
.dact{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surf2);border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:13.5px;z-index:60;animation:rise .25s}

@media (max-width:1560px){
  .floorrow{grid-template-columns:1fr}
  .feed{max-height:240px}
}
@media (max-width:1280px){
  .book{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .crow{grid-template-columns:130px minmax(0,1fr) 120px 130px}
  .crow .pr{display:none}
}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;z-index:30;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand span,.sidefoot,.nav .grp{display:none}
  .nav{display:flex;gap:4px}
  .nv{white-space:nowrap;width:auto}
  .nv[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .topbar{position:static}
  .main{padding-inline:16px}
  .intake,.pol,.gov,.notice,.whatif,.grid2,.twocol{grid-template-columns:1fr}
  .circs{grid-template-columns:1fr}
  .rail{grid-template-columns:repeat(3,1fr)}
  .fstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crow{grid-template-columns:1fr;gap:6px}
  .task{grid-template-columns:22px 1fr;row-gap:4px}
  .task .ow,.task .du,.task .pill{grid-column:2}
  .lookup{margin-left:0;width:100%}
  .lookup input{flex:1;width:auto}
  .legend .mix{margin-left:0}
  .guards{grid-template-columns:1fr}
}
@media (max-width:520px){
  .kpis,.wkpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .abar{grid-template-columns:118px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><i></i></div><div><b>RegPulse</b><span>Nivaas Home Finance</span></div></div>
    <nav class="nav" id="nav" aria-label="Screens"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="pageTitle">Agent floor</h1>
      <span class="cur" id="curChip"><i></i><span>Circular: <b id="curName">Repo rate hike</b></span></span>
      <form class="lookup" id="lookupForm" autocomplete="off">
        <input id="lookupIn" list="ids" placeholder="Loan ID or name" aria-label="Look up a loan">
        <datalist id="ids"></datalist>
        <button class="btn" type="submit">Trace loan</button>
      </form>
    </div>

    <!-- Regulatory feed -->
    <section class="screen" data-s="feed" hidden></section>

    <!-- Agent floor -->
    <section class="screen" data-s="floor">
      <div class="intake">
        <div class="circs" id="circs"></div>
        <div class="controls">
          <button class="btn primary run" id="runBtn"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span>Run update</span></button>
          <div class="speed"><span class="eyebrow">Speed</span>
            <div class="seg" id="speedSeg"><button data-s="1" aria-pressed="true">1×</button><button data-s="2" aria-pressed="false">2×</button><button data-s="4" aria-pressed="false">4×</button></div>
            <button class="btn ghost" id="skipBtn" disabled>Skip</button>
          </div>
        </div>
      </div>
      <nav class="rail" id="rail" aria-label="Stages"></nav>
      <div id="doneBar" hidden></div>
      <div id="brief" hidden></div>
      <div class="floorrow">
        <div class="floorbox"><div class="floor" id="floor"><svg class="edges" id="edges"></svg></div></div>
        <aside class="feed" id="feed">
          <header><b>Live log</b><span class="live"><i></i><span id="liveTxt">Idle</span></span></header>
          <ol id="feedList"></ol>
        </aside>
      </div>
      <div class="legend" id="legend"></div>
      <div class="book">
        <div class="panel">
          <div class="bookhd"><h2>Housing book</h2><span>2,400 loans · one dot each · click a dot</span></div>
          <canvas class="bookCanvas" aria-label="Loan book, one dot per loan"></canvas>
        </div>
        <div class="panel bands" id="floorBands"></div>
      </div>
    </section>

    <section class="screen" data-s="impact" hidden></section>
    <section class="screen" data-s="borrowers" hidden></section>
    <section class="screen" data-s="policy" hidden></section>
    <section class="screen" data-s="notices" hidden></section>
    <section class="screen" data-s="tasks" hidden></section>
    <section class="screen" data-s="model" hidden></section>
    <section class="screen" data-s="ask" hidden></section>
  </main>
</div>
<div id="drawerRoot"></div>

<script>
/* ================= icons ================= */
const ICON = {
  genai:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.6 4.4L14 7 9.6 8.6 8 13 6.4 8.6 2 7l4.4-1.6z"/><circle cx="13" cy="13" r="1.3"/></svg>',
  agent:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 8l3-3M8 2.5V4M13.5 8H12"/></svg>',
  ml:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="3.5" cy="4" r="1.6"/><circle cx="3.5" cy="12" r="1.6"/><circle cx="12.5" cy="8" r="1.6"/><path d="M5 4.6l6 2.8M5 11.4l6-2.8"/></svg>',
  rules:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M5 6h6M5 8.5h6M5 11h3"/></svg>',
  human:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="5" r="2.6"/><path d="M3 14c.6-2.8 2.6-4.2 5-4.2s4.4 1.4 5 4.2"/></svg>',
  locked:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3 3 7-7"/></svg>',
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>',
  arrow:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8h11M9 4l4 4-4 4"/></svg>',
  doc:'<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 1.5h5.5L12.5 4.5v10h-8.5z"/><path d="M9.5 1.5v3h3M6 8h4.5M6 10.5h4.5"/></svg>',
};
const NAVICON = {
  feed:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3.5h10M3 8h10M3 12.5h6"/><circle cx="13" cy="12.5" r="1.4" fill="currentColor"/></svg>',
  floor:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3" width="4" height="4" rx="1"/><rect x="10.5" y="1.5" width="4" height="4" rx="1"/><rect x="10.5" y="10.5" width="4" height="4" rx="1"/><path d="M5.5 5h2.5v-1.5h2.5M8 5v7.5h2.5"/></svg>',
  impact:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="3" height="3" rx=".6"/><rect x="6.5" y="2" width="3" height="3" rx=".6" opacity=".5"/><rect x="11" y="2" width="3" height="3" rx=".6"/><rect x="2" y="6.5" width="3" height="3" rx=".6" opacity=".5"/><rect x="6.5" y="6.5" width="3" height="3" rx=".6"/><rect x="11" y="6.5" width="3" height="3" rx=".6" opacity=".5"/><rect x="2" y="11" width="3" height="3" rx=".6"/><rect x="6.5" y="11" width="3" height="3" rx=".6" opacity=".5"/><rect x="11" y="11" width="3" height="3" rx=".6"/></svg>',
  borrowers:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5.5" r="2.3"/><path d="M1.8 13.5c.5-2.4 2.2-3.6 4.2-3.6s3.7 1.2 4.2 3.6"/><path d="M10.5 3.4a2.2 2.2 0 010 4.2M12 9.9c1.2.4 2 1.6 2.3 3.6"/></svg>',
  policy:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M6 8.5l1.5 1.5 3-3"/></svg>',
  notices:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h12v7.5H6.5L3.5 13.5V11H2z"/></svg>',
  tasks:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 8l2 2 4-4"/></svg>',
  model:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  ask:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.6 4.4L14 7 9.6 8.6 8 13 6.4 8.6 2 7l4.4-1.6z"/></svg>',
};
const SCREENS = [
  {id:'feed', label:'Regulatory feed', grp:'Monitor'},
  {id:'floor', label:'Agent floor'},
  {id:'impact', label:'Portfolio impact', grp:'Results'},
  {id:'borrowers', label:'Borrowers'},
  {id:'policy', label:'Policy changes'},
  {id:'notices', label:'Customer notices', grp:'Execute'},
  {id:'tasks', label:'Compliance tasks'},
  {id:'model', label:'Model governance', grp:'Control'},
  {id:'ask', label:'Ask RegPulse'},
];
const TYPE = {
  genai:{label:'GenAI', why:'Reads and writes language'},
  agent:{label:'Agentic', why:'Plans and picks next step'},
  ml:{label:'ML model', why:'Learns patterns from data'},
  rules:{label:'Rules & math', why:'Exact, repeatable, no guessing'},
  human:{label:'Human', why:'Approves before anything moves'},
  locked:{label:'Locked model', why:'Validated. Read-only. Never retrained here'},
};

/* ================= agents ================= */
const STAGES = ['Detect','Read','Measure','Score','Act','Approve'];
const AGENTS = [
  {id:'watch', col:0, name:'Regulatory Watcher', type:'agent'},
  {id:'interp',col:1, name:'Circular Interpreter', type:'genai', sub:'LLM'},
  {id:'mapper',col:1, name:'Applicability Mapper', type:'rules', sub:'+ LLM'},
  {id:'scan',  col:2, name:'Portfolio Scanner', type:'rules', sub:'Query'},
  {id:'emi',   col:2, name:'EMI & Reset Engine', type:'rules', sub:'Calculator'},
  {id:'stress',col:3, name:'Stress Test Runner', type:'ml', sub:'Scenarios'},
  {id:'core',  col:3, name:'Core Credit Model', type:'locked', sub:'v4.2'},
  {id:'seg',   col:3, name:'Borrower Segmenter', type:'ml', sub:'Clustering'},
  {id:'ews',   col:3, name:'Early Warning', type:'ml', sub:'Anomaly'},
  {id:'strat', col:4, name:'Mitigation Strategist', type:'agent'},
  {id:'policy',col:4, name:'Policy Advisor', type:'agent'},
  {id:'draft', col:4, name:'Notice Drafter', type:'genai', sub:'LLM'},
  {id:'track', col:4, name:'Compliance Tracker', type:'rules', sub:'Workflow'},
  {id:'rmq',   col:5, name:'RM Queue', type:'human'},
  {id:'ccm',   col:5, name:'Credit Committee', type:'human'},

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function emiCalc(P,rA,n){const r=rA/1200;const f=Math.pow(1+r,n);return P*r*f/(f-1)}
function pvCalc(E,rA,n){const r=rA/1200;return E*(1-Math.pow(1+r,-n))/r}
function nNeed(P,rA,E){const r=rA/1200;if(E<=P*r)return Infinity;return -Math.log(1-r*P/E)/Math.log(1+r)}
const BOOK = [];
for(let i=0;i<2400;i++){
  const tr=rnd(); const tier = tr<.42?'Metro':tr<.8?'Tier-2':'Tier-3';

  const t = .25+rnd()*.38; const other = rnd()<.55? inc*Math.min(t-.15,rnd()*.14):0;
  const P = Math.round(pvCalc(inc*t-other,rate,n)/1000)*1000;

}

/* Frozen core model. Weights fixed; RegPulse only calls score(). */
const CORE_MODEL = Object.freeze({version:'4.2', validated:'Mar 2026', owner:'Model Risk Management', algo:'Scorecard (logistic)',
  score(x){const z=-4.25+5.2*(x.foir-.45)+2.4*(x.ltv/100-.68)-.012*(x.bureau-755)+(x.dpd30?.8:0)+(x.se?.3:0);return 1/(1+Math.exp(-z))}});
const band = pd => pd<.025?'Low':pd<.06?'Watch':'High';
const BRANK = {Low:0,Watch:1,High:2};
const BCOL = {Low:'#5C7FA3',Watch:'#E6C84F',High:'#F0616D'};
const grpOf = a => (a.se?'Self-employed':'Salaried')+' · '+a.tier;

function evaluate(key,p){
  const rows=[]; let reads=0;
  for(const a of BOOK){
    let inScope=false, impacted=false, emi1=a.emi0, n1=a.n, r1=a.rate, capHit=false;
    const capN=(65-a.age)*12;
    if(key==='repo'){ inScope=a.floating; if(inScope){impacted=true; r1=a.rate+p/100; emi1=emiCalc(a.P,r1,a.n); capHit=!(nNeed(a.P,r1,a.emi0)<=capN);} }
    else if(key==='reset'){ inScope=a.floating; const cN=(p-a.age)*12; if(inScope && a.n>cN){impacted=true; n1=Math.max(12,cN); emi1=emiCalc(a.P,a.rate,n1); capHit=true;} }
    else { inScope=a.ltv>p; if(inScope){impacted=true; r1=a.rate+.25; emi1=emiCalc(a.P,r1,a.n); capHit=!(nNeed(a.P,r1,a.emi0)<=capN);} }
    const foir1=(emi1+a.other)/a.inc;
    const pd0=CORE_MODEL.score({foir:a.foir0,ltv:a.ltv,bureau:a.bureau,dpd30:a.dpd30,se:a.se});
    const pd1=impacted?CORE_MODEL.score({foir:foir1,ltv:a.ltv,bureau:a.bureau,dpd30:a.dpd30,se:a.se}):pd0;
    if(impacted) reads+=2;
    const b0=band(pd0), b1=band(pd1);
    let seg='—', action=null;
    if(impacted){
      seg = a.age>=50?'Near retirement': (a.se&&foir1>.55)?'Thin-margin self-employed': (!a.se&&foir1>.55)?'Stretched salaried':'Comfortable';
      if(a.ews && b1!=='Low') action='Priority RM call';
      else if(b1==='High' && foir1>=.6) action='Restructure check';
      else if(foir1>=.58 && !capHit && key!=='reset') action='Tenure extension';
      else if(foir1>=.58) action='Counselling call';
      else if(b1!=='Low' && (key==='reset' || (key==='repo' && p>=75))) action='Fixed-rate switch';
      else if(!a.se && foir1<.42) action='Prepayment nudge';
      else action='Inform only';
    }
    rows.push({a,inScope,impacted,emi1,n1,r1,capHit,foir1,pd0,pd1,b0,b1,seg,action,lang:LANG[a.city]||'en'});
  }
  const imp=rows.filter(r=>r.impacted);
  const cnt=(arr,f)=>arr.reduce((s,r)=>s+(f(r)?1:0),0);
  const bandCount=(arr,k)=>({Low:cnt(arr,r=>r[k]==='Low'),Watch:cnt(arr,r=>r[k]==='Watch'),High:cnt(arr,r=>r[k]==='High')});
  const acts={}; ACTIONS.forEach(x=>acts[x.k]=0); imp.forEach(r=>acts[r.action]++);
  const segs={}; imp.forEach(r=>segs[r.seg]=(segs[r.seg]||0)+1);
  const grp={}; imp.forEach(r=>{const g=grpOf(r.a);(grp[g]=grp[g]||{n:0,d:0,high:0,over60:0}).n++;grp[g].d+=(r.pd1-r.pd0)*100;if(r.b1==='High')grp[g].high++;if(r.foir1>=.6)grp[g].over60++;});
  let drift=null, topHigh=null;
  for(const [g,v] of Object.entries(grp)){ if(v.n<25) continue; const avg=v.d/v.n, hs=v.high/v.n;
    if(!drift||avg>drift.avg) drift={g,avg,n:v.n}; if(!topHigh||hs>topHigh.share) topHigh={g,share:hs,n:v.n,over60:v.over60}; }
  return {key,p,rows,imp,inScope:cnt(rows,r=>r.inScope),impacted:imp.length,
    emiUp:imp.length?imp.reduce((s,r)=>s+(r.emi1-r.a.emi0),0)/imp.length:0,capHit:cnt(imp,r=>r.capHit),
    before:bandCount(imp,'b0'),after:bandCount(imp,'b1'),moved:cnt(imp,r=>BRANK[r.b1]>BRANK[r.b0]),
    ews:cnt(imp,r=>!!r.a.ews),acts,segs,grp,drift,topHigh,reads,actioned:imp.length-acts['Inform only'],
    flag: drift && drift.avg>.25 ? drift : null};
}

const svgNS='http://www.w3.org/2000/svg'; const EDGE_EL={};
function typeColor(t){return getComputedStyle(document.documentElement).getPropertyValue('--'+t).trim()}
function drawEdges(){
  const svg=$('#edges'), f=$('#floor'), fr=f.getBoundingClientRect(); if(!fr.width) return;
  svg.setAttribute('viewBox',`0 0 ${fr.width} ${fr.height}`); svg.innerHTML='';
  for(const [a,b,kind] of EDGES){
    const A=$('#ag-'+a).getBoundingClientRect(), B=$('#ag-'+b).getBoundingClientRect(); let d;
    if(AG[a].col===AG[b].col){ const x1=A.right-fr.left,y1=A.top+A.height/2-fr.top,x2=B.right-fr.left,y2=B.top+B.height/2-fr.top; d=`M${x1},${y1} C${x1+26},${y1} ${x2+26},${y2} ${x2},${y2}`; }
    else { const x1=A.right-fr.left,y1=A.top+A.height/2-fr.top,x2=B.left-fr.left,y2=B.top+B.height/2-fr.top,dx=Math.max(30,(x2-x1)*.5); d=`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`; }
    const p=document.createElementNS(svgNS,'path'); p.setAttribute('d',d); const k=a+'-'+b; EDGE_EL[k]=p;
    if(kind==='guard'){p.classList.add('guard'); p.style.stroke='var(--locked)';}
    if(S.lit.has(k)){p.classList.add('lit'); if(kind!=='guard') p.style.stroke=typeColor(AG[a].type);}
    svg.append(p);
  }
}
function packet(a,b,rev=false){
  const k=a+'-'+b, path=EDGE_EL[k], my=S.runId; if(!path) return Promise.resolve();
  const col=typeColor(AG[rev?b:a].type);
  const fin=()=>{S.lit.add(k); path.classList.add('lit'); if(!path.classList.contains('guard')) path.style.stroke=col;};
  if(reduced||S.speed>=20||S.screen!=='floor'){fin();return sleep(250);}
  const len=path.getTotalLength(); if(!len){fin();return Promise.resolve();}
  const c=document.createElementNS(svgNS,'circle'); c.setAttribute('r',4.2); c.setAttribute('fill',col); c.style.filter=`drop-shadow(0 0 5px ${col})`; $('#edges').append(c);
  const dur=720/S.speed;
  return new Promise(res=>{const t0=performance.now();(function f(t){ if(!alive(my)){c.remove();return res();}
    const q=Math.min(1,(t-t0)/dur), e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2, pt=path.getPointAtLength((rev?1-e:e)*len);
    c.setAttribute('cx',pt.x); c.setAttribute('cy',pt.y); if(q<1) requestAnimationFrame(f); else {c.remove(); fin(); res();}})(t0);});
}

/* ================= book canvas ================= */
const BOOKSTATE=new Array(2400).fill('#222C40');
function drawBook(){
  $$('canvas.bookCanvas').forEach(cv=>{
    const w=cv.clientWidth; if(!w) return; const dpr=window.devicePixelRatio||1;
    const size=w<500?5:7, gap=w<500?2:3, cols=Math.floor((w+gap)/(size+gap)), rows=Math.ceil(2400/cols), h=rows*(size+gap)-gap;
    cv._geo={cols,size,gap}; cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
    const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
    for(let i=0;i<2400;i++){const c=i%cols,r=Math.floor(i/cols); x.fillStyle=BOOKSTATE[i]; x.beginPath(); if(x.roundRect) x.roundRect(c*(size+gap),r*(size+gap),size,size,1.5); else x.rect(c*(size+gap),r*(size+gap),size,size); x.fill();}
  });
}
document.addEventListener('click',e=>{
  const cv=e.target.closest('canvas.bookCanvas'); if(!cv||!cv._geo) return;
  const rc=cv.getBoundingClientRect(), {cols,size,gap}=cv._geo;
  const c=Math.floor((e.clientX-rc.left)/(size+gap)), r=Math.floor((e.clientY-rc.top)/(size+gap)), i=r*cols+c;
  if(c<cols && i>=0 && i<2400) openBorrower(i);
});
async function animateBook(fnColor,ms){const my=S.runId, steps=24;
  for(let s=1;s<=steps;s++){ if(!alive(my))return; const upto=Math.floor(2400*s/steps); for(let i=Math.floor(2400*(s-1)/steps);i<upto;i++){const c=fnColor(i); if(c) BOOKSTATE[i]=c;} drawBook(); await sleep(ms/steps);} }

      ev:[[nf(res.acts['Fixed-rate switch']),'borrowers fit the switch today'],[nf(res.after.Watch),'in Watch band'],['0','changes to the core model']],
      filter:r=>r.action==='Fixed-rate switch', fl:'Fixed-rate switch', owner:'Product & Pricing Committee'};
  } else {
    P2={id:'p2',t:'Lower origination LTV cap',who:'Loans above ₹30L',o:'90%',n:p+'%',doc,sec:'§4.6 Loan-to-value limits',
      pieces:[['s','For loans above ₹30 lakh, maximum LTV shall be '],['d','90%'],['i',p+'%'],['s',' of the property value.']],
      ev:[[nf(res.inScope),`loans sit above ${p}% LTV`],[nf(res.after.High),'of them in High band'],['+15 pts','risk weight on this band']],
      filter:r=>r.impacted, fl:`LTV above ${p}%`, owner:'Credit Policy Committee'};
    P3={id:'p3',t:'Price by LTV band',who:'New loans',o:'Flat spread',n:`+25 bps above ${p}%`,doc:'Pricing Policy v4.1',sec:'§3.2 Spread grid',

    {q:'Which policy section changes?',f:()=>{const ps=proposals(res); return {big:ps.length+' sections',p:ps.map(x=>`${x.sec} (${x.o} → ${x.n})`).join('; ')+'.',who:['policy','ccm']}}},
    {q:'Does this touch the core model?',f:()=>({big:'No',p:`${nf(res.reads)} read-only calls, 0 writes. Weights frozen at v${CORE_MODEL.version}. ${res.flag?'One score-shift flag sent to Model Risk.':'No drift flag.'}`,who:['stress','core','mrm']})},
    key==='repo'?{q:'What if the hike is 100 bps?',f:()=>{const r2=evaluate('repo',100); return {big:nf(r2.moved)+' move up',p:`At 100 bps: ${nf(r2.after.High)} in High band, ${nf(r2.capHit)} with no tenure room, avg EMI +${inr(r2.emiUp)}.`,who:['emi','stress']}}}
    :key==='reset'?{q:'Near-retirement borrowers?',f:()=>{const g=res.imp.filter(r=>r.a.age>=50); return {big:nf(g.length)+' loans',p:`Aged 50+ and past the cap. Avg EMI jump ${inr(g.reduce((s,r)=>s+r.emi1-r.a.emi0,0)/(g.length||1))}.`,who:['emi','seg','strat']}}}
    :{q:'Can prepayment help?',f:()=>{const g=res.imp.filter(r=>r.a.ltv-res.p<3); return {big:nf(g.length)+' loans',p:`Within 3 pts of ${res.p}% LTV. A small part-prepayment keeps their current rate.`,who:['scan','emi','strat']}}},
  ];
  const ans=S.q!=null&&Q[S.q]?Q[S.q].f():null;
  el.innerHTML=`<p class="intro">Ask about the last run. Numbers come from the engines. GenAI only phrases the answer.</p>
  <div class="ask"><div class="qs">${Q.map((x,i)=>`<button class="q" data-q="${i}" aria-pressed="${S.q===i}">${x.q}</button>`).join('')}</div>
  ${ans?`<div class="ans"><div class="big">${ans.big}</div><p>${ans.p}</p><div class="who">${ans.who.map(chipOf).join('')}</div></div>`:'<p class="rulenote">Pick a question.</p>'}</div>`;
  el.onclick=e=>{const b=e.target.closest('.q'); if(b){S.q=+b.dataset.q; renderAsk();}};
}

/* ================= borrower drawer ================= */
function openBorrower(i){
  const res=S.res||evaluate(S.scn,S.params[S.scn]); const key=res.key;
  const r=res.rows[i], a=r.a, s=SCN[key], tr=[];
  tr.push(['watch',`Circular: <b>${s.title}</b>`]);
  tr.push(['mapper',r.inScope?`Applies: <b>${key==='ltv'?'LTV '+a.ltv+'%':'floating-rate loan'}</b>`:`Not in scope: <b>${key==='ltv'?'LTV '+a.ltv+'% under threshold':'fixed-rate loan'}</b>`]);
  if(r.inScope && !r.impacted) tr.push(['emi',`No change needed: loan ends before age ${res.p}`]);
  if(r.impacted){
    tr.push(['scan',`Outstanding <b>${inr(a.P)}</b> · ${Math.round(a.n/12)} yrs left`]);
    tr.push(['emi',`EMI <b>${inr(a.emi0)} → ${inr(r.emi1)}</b>${r.capHit?' · no tenure room':' · tenure room left'}`]);
    tr.push(['stress',`Stressed FOIR <b>${pc(r.foir1)}</b> sent to core model`]);
    tr.push(['core',`PD <b>${pc(r.pd0,1)} → ${pc(r.pd1,1)}</b> · read-only call`]);
    tr.push(['seg',`Group: <b>${r.seg}</b>`]);
    tr.push(['ews',a.ews?`<b style="color:var(--high)">${a.ews}</b>`:'No warning signal']);
    tr.push(['strat',`Suggests <b>${r.action}</b>`]);
    tr.push(['draft',`Notice ready in <b>${{en:'English',hi:'Hindi',mr:'Marathi'}[r.lang]}</b>`]);
    tr.push(['rmq',r.action==='Inform only'?'Auto-notice only. No RM task.':(S.queued.has(i)?'<b>Sent</b> · awaiting RM':'Waiting for RM approval')]);
  } else tr.push(['strat','No action needed']);
  const act=ACTIONS.find(x=>x.k===r.action);
  const why=r.impacted?[act.why,`FOIR ${pc(r.foir1)}`,`${r.b0} → ${r.b1}`,a.ews?'EWS flag':null].filter(Boolean).join(' · '):'';
  const root=$('#drawerRoot');
  root.innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Borrower trace">
    <div class="dhd"><div><div class="eyebrow mono">${a.id}${S.res?'':' · preview, not yet run'}</div><h3>${a.name}</h3><div class="sub">${a.city} · ${a.tier} · ${a.se?'Self-employed':'Salaried'} · ${a.age} yrs · Bureau ${a.bureau}</div></div>
      <button class="x" id="xBtn" aria-label="Close"><svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
    ${r.impacted?`<div class="cmp"><span class="h"></span><span class="h" style="text-align:right">Now</span><span class="h"></span><span class="h" style="text-align:right">After</span>
      <span>EMI</span><span class="o">${inr(a.emi0)}</span><span class="arrow">→</span><span class="n">${inr(r.emi1)}</span>
      <span>Rate</span><span class="o">${a.rate.toFixed(2)}%</span><span class="arrow">→</span><span class="n">${r.r1.toFixed(2)}%</span>
      <span>Tenure left</span><span class="o">${Math.round(a.n)} mo</span><span class="arrow">→</span><span class="n">${Math.round(r.n1)} mo</span>
      <span>FOIR</span><span class="o">${pc(a.foir0)}</span><span class="arrow">→</span><span class="n">${pc(r.foir1)}</span>
      <span>Risk band</span><span class="o">${r.b0}</span><span class="arrow">→</span><span class="n" style="color:${BCOL[r.b1]}">${r.b1}</span></div>`:''}
    <div><div class="eyebrow" style="margin-bottom:10px">Agent trail · this loan</div><ol class="trail">${tr.map(([id,t],k)=>`<li class="t-${AG[id].type}" style="animation-delay:${reduced?0:k*170}ms"><span class="dot"></span><div><div class="who">${AG[id].name} <span class="chip">${TYPE[AG[id].type].label}</span></div><div class="txt">${t}</div></div></li>`).join('')}</ol></div>
    ${r.impacted?`<div class="reco"><span class="chip t-agent">Suggestion</span><div class="a">${r.action}</div><div class="why">${why}</div>
      <div class="dact">${r.action==='Inform only'?'<span class="rulenote">Notice only, after compliance approval</span>':S.queued.has(i)?'<span class="pill ok">Sent to RM</span>':'<button class="btn primary" id="qBtn">Send to RM queue</button><button class="btn ghost" id="skipB">Not now</button>'}</div></div>`:''}
    <div class="rulenote">${ICON.locked.replace('<svg','<svg width="12" height="12" style="vertical-align:-2px"')} Core model scored this loan read-only. Nothing is auto-executed.</div>
  </aside>`;
  const close=()=>{root.innerHTML='';};
  $('#scrim').onclick=close; $('#xBtn').onclick=close; $('#xBtn').focus();
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k);}});
  const q=$('#qBtn'); if(q) q.onclick=()=>{S.queued.add(i); toast('Sent to RM queue · awaiting approval'); openBorrower(i); if(S.screen==='borrowers') renderBorrowers();};
  const sk=$('#skipB'); if(sk) sk.onclick=close;
}

/* ================= controls & boot ================= */
$('#runBtn').onclick=()=>run();
$('#skipBtn').onclick=()=>{S.prevSpeed=S.speed<20?S.speed:S.prevSpeed; S.speed=40; $$('#speedSeg button').forEach(b=>b.setAttribute('aria-pressed','false'));};
$('#speedSeg').onclick=e=>{const b=e.target.closest('button'); if(!b)return; S.speed=+b.dataset.s; S.prevSpeed=S.speed; $$('#speedSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));};
$('#lookupForm').addEventListener('submit',e=>{e.preventDefault(); const v=$('#lookupIn').value.trim().toLowerCase(); if(!v)return;
  const a=BOOK.find(b=>b.id.toLowerCase()===v)||BOOK.find(b=>b.id.toLowerCase().includes(v))||BOOK.find(b=>b.name.toLowerCase().includes(v));
  if(a) openBorrower(a.i); else toast('No loan matches “'+$('#lookupIn').value+'”');});
$('#ids').innerHTML=BOOK.filter((_,i)=>i%60===0).map(b=>`<option value="${b.id}">${b.name}</option>`).join('');

buildNav(); buildCircs(); buildRail(); buildLegend(); resetFloor(); updateBadges();
let start='floor'; try{const h=location.hash.slice(1); if(SCREENS.some(s=>s.id===h)) start=h;}catch(e){}
go(start);
let rt; const redraw=()=>{clearTimeout(rt); rt=setTimeout(()=>{drawEdges(); drawBook();},80);};
new ResizeObserver(redraw).observe($('#floor')); window.addEventListener('resize',redraw);
if(document.fonts) document.fonts.ready.then(()=>{drawEdges(); drawBook();});
</script>

</body>
